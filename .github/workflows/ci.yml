name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Check PEP 8 compliance
        run: uv run python scripts/dev.py pycodestyle

      - name: Run unit tests
        run: uv run python scripts/dev.py test

  cli-without-tkinter:
    # tkinter is a separate package on Linux (python3-tk on Debian and
    # Ubuntu) and is not guaranteed to be installed, so `--help` and
    # `--json` must work without it. tkinter is blocked explicitly here
    # rather than relying on the runner image lacking it, so this job
    # proves the same thing on every runner.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Run the CLI with tkinter blocked
        run: |
          uv run python - <<'PY'
          import io
          import contextlib
          import sys


          class Blocker:
              """Make `import tkinter` fail, as on a host without it."""

              def find_spec(self, name, path=None, target=None):
                  if name == "tkinter" or name.startswith("tkinter."):
                      raise ModuleNotFoundError("No module named 'tkinter'")
                  return None


          sys.meta_path.insert(0, Blocker())

          from deepseek_pricing import main

          failed = False
          for argv in (["--help"], ["--json", "--max-periods", "2"]):
              out, err = io.StringIO(), io.StringIO()
              try:
                  with contextlib.redirect_stdout(out), \
                          contextlib.redirect_stderr(err):
                      status = main(argv)
              except SystemExit as exit_error:
                  # argparse's help action exits instead of returning.
                  status = exit_error.code
              print(f"{argv[0]}: exit {status}, {len(out.getvalue())} bytes")
              failed = failed or status != 0 or not out.getvalue()

          if failed:
              print("CLI failed with tkinter blocked", file=sys.stderr)
              sys.exit(1)

          # The json output must still be a parseable document.
          import json
          from deepseek_pricing import main as run

          buffer = io.StringIO()
          with contextlib.redirect_stdout(buffer):
              run(["--json", "--max-periods", "2"])
          document = json.loads(buffer.getvalue())
          print(f"json: {len(document['periods'])} periods")
          if len(document["periods"]) != 2:
              sys.exit("json period count is wrong")
          PY
